# Produção (VM própria, nenhuma porta publicada no host). Segredos em ops/secrets/<nome> (gitignored).
# Entrada por Cloudflare Tunnel (serviço cloudflared, profile "tunnel"):
#   docker compose -f ops/compose.yaml --profile tunnel up -d --build [--scale api=4]
# Entrada por Nginx Proxy Manager na rede externa npm_network: veja ops/compose.npm.yaml.
# A app lê VAR ou VAR_FILE; aqui só os *_FILE (nunca valores) entram no ambiente.
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  EVENT_ID: ${EVENT_ID:?defina EVENT_ID}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?defina PUBLIC_BASE_URL}
  MONGODB_DB: ${MONGODB_DB:-techwoman}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGODB_URI_FILE: /run/secrets/mongo_uri
  # a API decide os canais ao enfileirar e o worker envia: os dois precisam ler o mesmo valor
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-cloud}

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cf_tunnel_token
    secrets: [cf_tunnel_token]
    networks: [edge]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

  web:
    build:
      context: ..
      dockerfile: ops/web.Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?defina VITE_TURNSTILE_SITE_KEY}
    <<: *hardening
    tmpfs: ["/tmp"]
    environment:
      # cf: a entrada é o cloudflared (CF-Connecting-IP); o compose.npm.yaml troca para x-real-ip
      CLIENT_IP_HEADER: cf
      # Analytics (Umami), lido em runtime pelo entrypoint; UMAMI_WEBSITE_ID vazio = desligado (docs/PLAN.md > Analytics)
      UMAMI_HOST_URL: ${UMAMI_HOST_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "1.0", memory: 256M } } }

  api:
    build: { context: .., dockerfile: ops/api.Dockerfile }
    command: ["node", "dist/server.js"]
    stop_grace_period: 30s
    <<: *hardening
    environment:
      <<: *app-env
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MENTEE_TOKEN_SECRET_FILE: /run/secrets/mentee_token_secret
      TURNSTILE_SECRET_FILE: /run/secrets/turnstile_secret
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      OUTBOX_KEY_FILE: /run/secrets/outbox_key
      # E47: só a API lê a chave do HMAC do webhook do WAHA
      WAHA_WEBHOOK_HMAC_KEY_FILE: /run/secrets/waha_webhook_hmac_key
    secrets: [mongo_uri, jwt_secret, mentee_token_secret, turnstile_secret, outbox_key, waha_webhook_hmac_key]
    networks: [app, egress]
    healthcheck:
      test: ["CMD", "node", "dist/health.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy: { resources: { limits: { cpus: "1.5", memory: 768M } } }

  worker:
    build: { context: .., dockerfile: ops/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    stop_grace_period: 30s
    <<: *hardening
    environment:
      <<: *app-env
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_KEY_FILE: /run/secrets/email_api_key
      MENTEE_TOKEN_SECRET_FILE: /run/secrets/mentee_token_secret
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN_FILE: /run/secrets/whatsapp_token
      OUTBOX_KEY_FILE: /run/secrets/outbox_key
      WAHA_URL: ${WAHA_URL:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY_FILE: /run/secrets/waha_api_key
    secrets: [mongo_uri, mentee_token_secret, email_api_key, whatsapp_token, outbox_key, waha_api_key]
    networks: [egress]
    healthcheck:
      test: ["CMD", "node", "dist/health.js", "worker"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

networks:
  edge: {}
  app: { internal: true }
  egress: {}

secrets:
  mongo_uri: { file: ./secrets/mongo_uri }
  jwt_secret: { file: ./secrets/jwt_secret }
  mentee_token_secret: { file: ./secrets/mentee_token_secret }
  turnstile_secret: { file: ./secrets/turnstile_secret }
  email_api_key: { file: ./secrets/email_api_key }
  outbox_key: { file: ./secrets/outbox_key }
  whatsapp_token: { file: ./secrets/whatsapp_token }
  waha_api_key: { file: ./secrets/waha_api_key }
  waha_webhook_hmac_key: { file: ./secrets/waha_webhook_hmac_key }
  cf_tunnel_token: { file: ./secrets/cf_tunnel_token }
