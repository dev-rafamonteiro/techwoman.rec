# Nginx sem root: escuta em 8080, pid e temporários em /tmp (tmpfs, filesystem read-only).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 2m;   # 1 MB JSON, 2 MB CSV (PLAN, Borda e API)

  include /tmp/resolver.conf;

  # IP real do cliente (rate limit e auditoria): define $client_ip. Gerado pelo entrypoint a partir de CLIENT_IP_HEADER:
  # "cf" (Cloudflare Tunnel: CF-Connecting-IP, posto pela borda da Cloudflare) ou "x-real-ip" (padrão; Nginx Proxy
  # Manager, que sempre sobrescreve X-Real-IP). Só um cabeçalho é aceito: os demais vêm do cliente e são forjáveis.
  include /tmp/client-ip.conf;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # SSE (E27 e demais streams) sem buffering; "api" é re-resolvido pelo DNS (escala com --scale api=N).
    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-store" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
    }

    # Link curto (E48): /l/<código> -> /api/l/<código>. add_header aqui descarta os do server, por isso se repetem;
    # no-referrer para o código não vazar no Referer.
    location /l/ {
      # o `set` vem antes: `rewrite ... break` encerra as diretivas do módulo rewrite que vierem depois
      set $api_upstream http://api:3000;
      rewrite ^/l/(.*)$ /api/l/$1 break;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; add_header X-Content-Type-Options "nosniff" always; }

    location / { try_files $uri $uri/ /index.html; }
  }
}
