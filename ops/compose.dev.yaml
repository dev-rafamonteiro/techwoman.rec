# Ambiente local completo, sem cloudflared:
#   docker compose -f ops/compose.dev.yaml --profile dev up --build     (web em http://localhost:8080)
#   docker compose -f ops/compose.dev.yaml --profile test up -d mongo-local   (só p/ os testes de integração: MONGODB_URI_TEST)
#   docker compose -f ops/compose.dev.yaml --profile dev up -d mailpit   (caixa de e-mail de dev: http://127.0.0.1:8025)
# Banco da aplicação: sempre o Atlas (MONGODB_URI do .env da raiz, via env_file). Nenhum banco local é criado para api/worker.
# mongo-local (perfil test): replica set via mongodb-atlas-local, usado só pelos testes de integração.
# Valores abaixo são só de desenvolvimento local; nada aqui é segredo real.
x-dev-env: &dev-env
  NODE_ENV: development
  PORT: "3000"
  EVENT_ID: ${EVENT_ID:-dev}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  MONGODB_DB: ${MONGODB_DB:-techwoman}
  LOG_LEVEL: info
  TRUST_PROXY: "true"
  COOKIE_SECURE: "false"
  MENTEE_TOKEN_SECRET: dev-only-mentee-token-secret-0123456789abcdef
  JWT_SECRET: dev-only-jwt-secret-troque-em-producao-0123456789
  # chaves de teste públicas da Cloudflare (sempre aprovam)
  TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
  TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # EMAIL_PROVIDER, EMAIL_API_KEY e EMAIL_FROM vêm do .env da raiz (Resend); sem eles, o worker só registra em log.
  # WhatsApp: WHATSAPP_ENABLED vem só do .env da raiz (env_file); ausente = false (tudo por e-mail). Não fica aqui
  # porque `environment` vence o env_file e a interpolação ${...} lê ops/.env, não o .env da raiz.
  # WAHA_API_KEY e WAHA_WEBHOOK_HMAC_KEY também vêm do .env da raiz; nunca entram aqui.
  WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-waha}
  WAHA_URL: ${WAHA_URL:-http://host.containers.internal:3000}
  WAHA_SESSION: ${WAHA_SESSION:-default}
  # Mailpit (perfil dev, rede egress): SMTP sem auth/TLS. `environment` vence o .env da raiz (nunca usa o Resend em dev).
  EMAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # chave AES-256 da outbox (senha provisória cifrada, 32 bytes em base64); só de dev, em produção é o secret outbox_key
  OUTBOX_KEY: ${OUTBOX_KEY:-1wb7LU18bDiW4H+NzUXjK7hZzlliuxBqoCQ4itcE0IA=}

services:
  mongo-local:
    image: mongodb/mongodb-atlas-local:8
    profiles: [test]
    ports:
      - "27017:27017"
    # sem volume de propósito: atlas-local não reinicia limpo sobre dados de um container anterior (RSGhost);
    # `stop`/`start` preserva os dados, `down` zera o banco de dev.
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok === 1 && db.hello().isWritablePrimary ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: { context: .., dockerfile: ops/api.Dockerfile }
    env_file:
      - path: ../.env
        required: false
    command: ["node", "dist/server.js"]
    stop_grace_period: 30s
    environment: *dev-env
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks: [dev, egress]
    healthcheck:
      test: ["CMD", "node", "dist/health.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build: { context: .., dockerfile: ops/api.Dockerfile }
    env_file:
      - path: ../.env
        required: false
    command: ["node", "dist/worker.js"]
    stop_grace_period: 30s
    environment: *dev-env
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks: [dev, egress]
    healthcheck:
      test: ["CMD", "node", "dist/health.js", "worker"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Recebe todo e-mail de dev (nada sai para fora). SMTP: mailpit:1025 nos containers, 127.0.0.1:1025 no host.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [egress]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: ops/web.Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:8080"
    networks: [dev]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  dev: {}
  egress: {}
